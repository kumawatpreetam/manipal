<!doctype html>
<html>
  <head>
    <title>Product Cards</title>
    <style>
      .card {
        border: 1px solid #000;
        padding: 10px;
        margin: 10px;
        width: 150px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Product 1</h3>
      <p>Quantity: <span id="count1">0</span></p>
      <button onclick="changeQty('count1', 1)">+</button>
      <button onclick="changeQty('count1', -1)">-</button>
    </div>

    <div class="card">
      <h3>Product 2</h3>
      <p>Quantity: <span id="count2">0</span></p>
      <button onclick="changeQty('count2', 1)">+</button>
      <button onclick="changeQty('count2', -1)">-</button>
    </div>

    <script>
      function changeQty(id, amount) {
        let element = document.getElementById(id);
        let count = parseInt(element.innerText) + amount;
        if (count >= 0) {
          element.innerText = count;
        }
      }
    </script>
  </body>
</html>
