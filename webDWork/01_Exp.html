<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Course Enrollment Form</title>
  </head>
  <body>
    <form action="">
      <fieldset>
        <legend>Personal Details</legend>

        <label for="name">Name</label>
        <input type="text" name="" id="name" placeholder="John" required />
        <br />
        <br />
        <label for="email">Email</label>
        <input
          type="email"
          name=""
          id="email"
          placeholder="john@gmail.com"
          required
        />
        <br />
        <br />
        <label for="password">Password</label>
        <input
          type="password"
          name=""
          id="password"
          placeholder="*******"
          required
        />
        <br />

        <p>Gender :</p>

        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" />
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" />

        <br />
        <p>Area of Interest :</p>
        <label for="ai">AI</label>
        <input type="checkbox" name="" id="ai" />
        <label for="ml">ML</label>
        <input type="checkbox" name="" id="ml" />
        <label for="ds">DataScience</label>
        <input type="checkbox" name="" id="ds" />
        <label for="development">Development</label>
        <input type="checkbox" name="" id="development" />
        <br />
        <br />

        <label for="course-selection">Course Selection :</label>
        <select name="" id="course-selection">
          <option value="Select Course">Select Course</option>
          <option value="BCA">BCA</option>
          <option value="MCA">MCA</option>
          <option value="BTech">BTech</option>
          <option value="MTech">MTech</option>
          <option value="MSc">BSc</option>
        </select>
        <br /><br />
        <label for="birth-date">DOB : </label>
        <input type="date" name="" id="birth-date" />

        <br /><br />
        <label for="experience">Experience Level :</label>
        <input
          type="range"
          id="experience"
          name=""
          min="0"
          max="100"
          value="20"
          step="5"
        />

        <br /><br />

        <input type="file" name="" id="" />

        <br />
        <br />
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </fieldset>
    </form>
  </body>
</html>
